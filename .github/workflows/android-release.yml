name: Android release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (for example v1.1.1)
        required: true
permissions:
  contents: write
concurrency:
  group: android-release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.6'
          cache: true
      - name: Validate version
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          VERSION=$(sed -n 's/^version: \([^+]*\)+.*/\1/p' app/pubspec.yaml)
          test "$TAG" = "v$VERSION"
      - name: Restore preserved signing key
        env:
          KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEY"
          printf '%s' "$KEY" | base64 --decode > "$RUNNER_TEMP/distribution.keystore"
          chmod 600 "$RUNNER_TEMP/distribution.keystore"
      - name: Install Android components
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358'
      - name: Verify and compile
        working-directory: app
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/distribution.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter pub get
          flutter test
          flutter build apk --release --target-platform android-arm64
          node tool/prepare_release.cjs
      - name: Publish APK and update metadata
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --title "Anivermaru $TAG" --generate-notes --latest
          fi
          gh release upload "$TAG" app/build/release/* --clobber
      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/distribution.keystore"
