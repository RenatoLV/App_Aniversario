name: Android release
on:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/android-release.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_BUILD: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/functions/package-lock.json
      - name: Verify card exchange rules
        working-directory: app/functions
        run: |
          npm ci
          npm test
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.6'
          cache: true
      - name: Assign increasing Android build number
        run: |
          VERSION=$(sed -n 's/^version: \([^+]*\)+.*/\1/p' app/pubspec.yaml)
          BUILD=$((1000 + RELEASE_BUILD))
          echo "ANDROID_BUILD_NUMBER=$BUILD" >> "$GITHUB_ENV"
          echo "TAG=v$VERSION-build$BUILD" >> "$GITHUB_ENV"
      - name: Restore preserved signing key
        env:
          KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEY"
          printf '%s' "$KEY" | base64 --decode > "$RUNNER_TEMP/distribution.keystore"
          chmod 600 "$RUNNER_TEMP/distribution.keystore"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android components
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358'
      - name: Verify and compile
        working-directory: app
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/distribution.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter pub get
          flutter analyze --no-pub
          flutter test
          flutter build apk --release --target-platform android-arm64 --build-number "$ANDROID_BUILD_NUMBER"
          (cd android && ./gradlew :app:testDebugUnitTest -Ptarget-platform=android-arm64)
          node tool/prepare_release.cjs
      - name: Publish APK and update metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target "$GITHUB_SHA" --title "Anivermaru $TAG" --generate-notes --latest
          fi
          gh release upload "$TAG" app/build/release/* --clobber
      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/distribution.keystore"
